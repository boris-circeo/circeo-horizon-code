# Sprint-6 WP4: HORIZON v2 on REAL archived forecasts (ECMWF HRES and AIFS), 2024 truth.
# Run with the 2024 ERA5 cache (built from the public archive, see docs/s6/PLAN.md):
#   HORIZON_YEAR=2024 HORIZON_ERA5_CACHE=$PWD/data/cache/era5_2024 HORIZON_EXPERIMENT=S6-real-forecasts \
#     bash scripts/s5/supervise.sh --campaign scripts/s6/campaign_real_2024.yaml
# Paired on the same windows and truth: real HRES vs the S5 emulator at nominal error (2 seeds),
# perfect forecast, oracle bound (leak-free terminal value) and the best fixed station B0.
# Windows: months of 2024 with HRES and AIFS (AIFS open data from 2024-02; HRES 2024-05 re-extracted).
duration_days: 30
tiers: [A]
windows:
  bench6_2024: ["2024-03-01", "2024-06-01", "2024-07-01"]
experiments:
  - {id: v2_real, tier: A, router: HORIZON_V2, seeds: [1], windows: bench6_2024, vary: {env.forecast: [hres, aifs]}}
  - {id: v2_emulator, tier: A, router: HORIZON_V2, seeds: [1, 2], windows: bench6_2024, b0: true}
  - {id: v2_perfect, tier: A, router: HORIZON_V2, seeds: [1], windows: bench6_2024, vary: {env.error_scale: [0.0]}}
  - id: oracle_v2
    tier: A
    router: Oracle_REF_H
    windows: bench6_2024
    variants:
      - {name: lwo_det, router: {clim_window: lwo, refiner_cpu_s: 0.0, refiner_max_iter: 500}}
