    bias towards the wind leaves the peak (P>=0.9 peak band 88-105 at 20 kn).'
  test: 'E-24: leeway k_L in {0, 0.02, 0.03, 0.05} and synthetic current 0.3-0.8 kn (random direction)
    on B0 and routed policies; measure drift and CF loss.'
  test_cost: cheap
  status: untestable-here
  notes: k_L 'to be measured for this platform' - rotors give unusual windage; wrong k_L changes B0 and
    any holding behaviour.
  s5_verdict: untestable-here
  s5_evidence: No leeway / current model in the truth simulator (S6 item).
