  s5_verdict: untestable-here
  s5_evidence: The persistent core has no return constraint in our runs; recall field not built.
- id: H-3-6
  v1_section: 3.5.1
  category: value-function
  statement: Decisions depend on V only through differences/gradients; a level-accurate but gradient-wrong
