  test_cost: medium
  status: nuanced
  notes: Offline layer = heaviest component of v1 (reforecasts, policy iteration); its added value over
    a climatology is not demonstrated.
  s5_verdict: nuanced
  s5_evidence: Two layers + refiner is confirmed as useful (refiner +2.9 pt, terminal +2.6 pt) but the
    learned value function brought +0.6 pt n.s. (S4) and the ensemble DP +0.0 pt at nominal error; v2
    keeps deterministic DP + climatological terminal + refiner.
- id: H-4-2
  v1_section: 4.2.2, 6.1
  category: algorithm-choice
  statement: Extending a deterministic horizon beyond its validity gives false information, so B1_15d
    should lose to B1_5d; the intermediate horizon with a good terminal is best.
  type: assumption
  used_for: 'D1 (long deterministic horizon without terminal optimises a fiction: cost is negative; intermediate
    10-15 d + good V_T is the only consistent option)'
  criticality: high
  evidence_so_far: 'S1 (synthetic, 5 seeds): B1_15d 16.2 % vs B1_5d 12.6 % regret; S2 diag: not reproduced
