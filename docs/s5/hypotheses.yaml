  test: 'E-04: horizons 1, 2, 3 d with terminal 0 and climatological.'
  test_cost: cheap
  status: confirmed
  notes: Needed to size the true value of anticipation (what the 5 d horizon already captures).
  s5_verdict: confirmed
  s5_evidence: '3 d horizon without terminal value: -2.7 pt (z -4.2); with 10 d horizon the terminal value
