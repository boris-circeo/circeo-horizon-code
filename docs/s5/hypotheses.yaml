  test: 'E-04: DP horizon in {1,2,3,5,7,10,15} d x terminal {0, clim, V_theta} x {control, ENS mean, ENS
    scenarios}; metric CF and paired gap.'
  test_cost: medium
  status: confirmed
  notes: 'Horizon response is built into our error law (D7 RMSE 6 m/s ~ climatological spread): ''no skill
