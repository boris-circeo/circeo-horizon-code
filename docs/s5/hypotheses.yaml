- id: H-3-1
  v1_section: 3.1 remark 1
  category: problem-structure
  statement: Weather is exogenous, so the problem is an MDP without action-observation coupling and the
    forecast/replan MPC decomposition loses little in theory.
  type: assumption
  used_for: D1 (MPC decomposition without major theoretical loss; exogenous weather)
  criticality: medium
  evidence_so_far: True by construction in the simulator. Fleet sensors/assimilation (v1 5.9, 7.8.4) would
    introduce coupling but are not modelled. The two-stage scenario MPC is not the optimal policy (see
    H-4-14).
  test: 'E-14: compare MPC variants with a long-lookahead oracle MPC and a multi-stage tree (E-11) to
    bound the loss.'
  test_cost: cheap
  status: supported-by-S0-S4
  notes: '''Without major loss'' is asserted not shown.'
- id: H-3-3
  v1_section: '3.2'
  category: value-function
  statement: The expected value of perfect information is of the order of 15-40 % of total energy.
  type: quantitative-claim
  used_for: D2, EVAL (EVPI of 15-40 % of total energy)
  criticality: high
  evidence_so_far: Best causal ENS_REF is 8.3 % below the approximate bound over 2015 (S4); S3 3.4-5.7
    % (30 d, ERA5); synthetic S1/S2 10-13 %. Bound is approximate (15 d lookahead + clim terminal), so
    true EVPI is >= these.
  test: 'E-14: Oracle horizon 5/10/15/30 d/full year; Oracle at 1 h DP; EVPI as function of forecast model
    error (E-01 with error scale -> 0 gives the limit).'
  test_cost: medium
  status: contradicted-by-S0-S4
  notes: Small EVPI because the BETA plateau makes the ship insensitive to timing (CF 0.88 even for hindsight).
    Directly limits the value of any forecast improvement.
- id: H-3-4
  v1_section: '3.3'
  category: operations
  statement: Compare regrets, never raw energies, since a NAO+ winter produces perhaps twice a blocked
    one.
  type: design-decision
  used_for: EVAL (regret vs oracle is the only metric that neutralises weather luck)
  criticality: medium
  evidence_so_far: We use paired J differences and regret vs Oracle_REF_H; monthly regret 2-20 % varies
    with season and with the approximate bound (S4).
  test: 'E-23: report paired differences (kWh) and CF points alongside regret; bootstrap by blocks of
    weeks.'
  test_cost: cheap
  status: confirmed
  notes: A regret ratio inherits the error of the bound; paired energy differences do not.
  s5_verdict: confirmed
  s5_evidence: 'Window-to-window spread of CF is 70-92 % for the same router; paired deltas have standard
    errors of 0.3-1 pt vs CF standard deviations of ~6 pt: only regrets/paired deltas are interpretable.'
- id: H-3-5
  v1_section: 3.4, 5.7
  category: fleet
  statement: For the persistent core the return constraint vanishes and reappears as a soft recall field
