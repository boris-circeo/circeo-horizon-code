  test: 'E-12: energy-stratified isochrone / label-correcting forward search with pruning on the same
    forecasts and graph; compare energy and cost to DP.'
  test_cost: medium
  status: untestable-here
  notes: '''Not transferable'' is true for the classic algorithms; the question is whether a forward Pareto-label
    method is competitive for single-ship planning.'
  s5_verdict: untestable-here
  s5_evidence: Not tested (no isochrone planner built); argument is theoretical and accepted.
- id: H-3-8
  v1_section: 3.1 remark 3, 6.4.4
  category: operations
  statement: The hard return constraint is handled as a chance constraint or by V falling to -inf outside
