  type: design-decision
  used_for: D2 (return constraint as chance constraint / retrievability cone)
  criticality: medium
  evidence_so_far: none (no return in S3-S4; S1 simplification).
  test: 'E-16: missions with return (45 d loop) in the simulator, cone vs soft feature.'
  test_cost: medium
  status: untestable-here
  notes: Matters for rotation legs and for the episodic V.
- id: H-3-9
  v1_section: 3.6, 4.9
