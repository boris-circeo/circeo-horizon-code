  type: assumption
  used_for: D2, D7 (only the spatial gradient of V drives the decision; level errors harmless)
  criticality: high
  evidence_so_far: 'S4_value: within-release R2 (ranking) 0.40 hindsight-trained vs 0.38 policy-consistent
