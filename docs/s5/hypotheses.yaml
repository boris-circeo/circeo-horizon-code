# HORIZON S5 - hypothesis register for the v1 design note (DES-860 rev A) and for our own test environment.
# One entry per assumption / quantitative claim / design decision / dismissed alternative.
# Status codes: open | supported-by-S0-S4 | contradicted-by-S0-S4 | untestable-here. 'H-X-*' = our own environment hypotheses.
# Experiment ids E-xx are defined in docs/s5/hypotheses.md. Note: figures marked 'S5 computation' were derived during this review from the ERA5 2015 cache and the BETA polar (aggregates only).
# S5 WP5: statuses (confirmed, refuted, nuanced, deferred, untestable-here) of tested entries come from docs/s5/verdicts.yaml (scripts/s5/apply_verdicts.py).
- id: H-1-1
  v1_section: 1.4, 2.1.1
  category: weather
  statement: Depressions translate at 20-35 kn, 4-6 times faster than the ship (3-9 kn, max 16 kn), so
    the ship can only be on a system's path, never chase it.
  type: quantitative-claim
  used_for: D1, D2 (need for anticipation)
  criticality: high
  evidence_so_far: none directly. S4 ships average 7.1 kn (p10-p90 3.6-10.4 kn, outputs/s4_runs A_B1c_REF_s1).
    Translation speed of 10 m wind maxima not yet measured on ERA5 (WP2).
  test: 'E-13: track TWS>20 kn blobs / lagged cross-correlation on ERA5 2015 (Hovmoeller along 50N) to
    get the distribution of 10 m-wind pattern speeds by season; compare with ship ground speed distribution.'
  test_cost: cheap
  status: nuanced
  notes: 20-35 kn is a cyclone-centre speed at 500-1000 hPa; 10 m wind footprints (jet, cold sector) can
    move slower or deform. Also the ship moves with the flow when downwind (P>0 at TWA 150-170 above 22
    kn), so 'cannot chase' is weaker in strong wind.
  s5_verdict: nuanced
  s5_evidence: 10 m wind patterns move at 18.7 kn median (weather_analysis), ~2.4x the ship's mean ground
    speed (7 kn), not 4-6x; cyclone-centre speeds overstate the footprint speed. The 'cannot chase' conclusion
    holds (chasing loses beyond ~12 h), with a weaker ratio.
- id: H-1-2
  v1_section: 1.5, 8.2 (B0)
  category: operations
  statement: Routing must beat the best fixed 'virtual mooring' B0 by a wide margin; if the gap is small
    the whole project is oversized (to be tested first).
  type: quantitative-claim
  used_for: D1 (existence of the project)
  criticality: high
  evidence_so_far: 'Annual CF 0.57 (B0) vs 0.775-0.807 (routed): +36 to +41 % energy, 12/12 months (S4_results.md);
    S3: +26 % (10/10 missions).'
  test: 'E-15: strengthen B0 (monthly best point, cross-validated point, B0 with explicit manoeuvre/drift
    losses, simple greedy heuristics) and re-measure the gap.'
  test_cost: cheap
  status: supported-by-S0-S4
  notes: Gap is measured against a B0 chosen on the same year (mild leakage that favours B0, i.e. conservative)
    but B0 has no explicit manoeuvre loss in the simulator (could favour B0). Winner is clear; margin
    of the order of 40 % not 4 %.
- id: H-1-3
  v1_section: 1.6, 7.7, B.2
  category: numerics
  statement: A full strategic cycle (7 scenarios + 10 km fine zone) costs 2-10 s on 16 cores, leaving
    margins of x15-60 against the 10 min budget.
  type: quantitative-claim
  used_for: DIM (compute budgets 1 min / 10 min / 1 h; margin x15-60)
  criticality: medium
  evidence_so_far: '40 km DP 13 d: 0.5 s (S1, K=21). Per replan single core: B1_5d 0.5 s, B1+REF 1.8 s,
    ENS(10 mb, k5, 10 d)+REF 5.5 s (S3). Year ENS_REF 20 members: 6.1 h on 2 workers = ~30 CPU-s/replan
    (S4). No 10 km fine zone built.'
  test: 'E-21: benchmark arcs/s per core (bench_dp), ENS N=51 w/o reduction, 10 km/1 h fine zone at the
    real size; extrapolate to 16 cores.'
  test_cost: cheap
  status: refuted
  notes: Our ENS_REF at 20 members costs ~15x the v1 'cycle'; the fine zone (10 km, 60 000 cells) was
    never implemented so the 3.2e8-arc estimate is untested.
  s5_verdict: refuted
  s5_evidence: Not the v1 algorithm (7 scenarios + 10 km zone was not built), but the measured cost of
    the implemented chain is 3-10 min CPU per 30-day window (1 core), i.e. 1.5-5 s per 6 h replan for
    B1c and ~13 s for ENS; margins are large, but driven by the refiner (IPOPT), not the DP.
- id: H-1-4
  v1_section: 1.5 pt 4, 6.12, 7.7
  category: discretisation
  statement: Surplus compute should buy ensemble width, never spatial/temporal resolution; numerical error
    is a fraction of a percent, negligible against forecast error.
  type: design-decision
  used_for: D6, D9 (spend budget on uncertainty width, never on spatial resolution)
  criticality: medium
  evidence_so_far: 'S1: stencil quantisation gives ~6 % orientation dependence; S3: macro arcs (K=21->49)
    cured ''square tracks''; refiner (continuous heading, 30 min) = +3.2 % (S2), +6.6 % (S3, 10/10); E0
    review: ~17 % of the 5 d hindsight bias is DP discretisation (97.4 % realised).'
  test: E-07 (grid 20/40/60 km, dt 1/3 h, stencil span) and E-06 (refiner vs finer DP) at fixed forecasts;
    E-11 (more members) to compare marginal returns per CPU-hour.
  test_cost: medium
  status: contradicted-by-S0-S4
  notes: 'Resolution matters at the 3-7 % level here, larger than the ensemble gain we could measure (+1.2
    %). Partly because our DP is coarse (40 km/3 h, no fine zone): the claim may hold for v1''s 10 km/1
    h zone.'
- id: H-2-1
  v1_section: 2.1.2
  category: weather
  statement: A moving corridor (~25 kn) outruns a ship capped at 16 kn; prolonging a rendezvous by chasing
    gives only a modest marginal gain.
  type: quantitative-claim
  used_for: D1, F-core (value of pursuit)
  criticality: medium
  evidence_so_far: none. S4 routed ships experience 22-29 kn mean TWS in winter vs 19-21 kn basin mean
    (S4_results.md), i.e. they do harvest the strong sectors.
  test: 'E-13: oracle (Oracle_REF_H) with ship max speed capped at 4/8/12/16 kn, and with a ''frozen position''
    (hold) variant; value of mobility = CF vs speed cap and vs reachable radius.'
  test_cost: medium
  status: confirmed
  notes: Tests the value of mobility itself, which decides whether a station-keeping-plus-slow-drift strategy
    is nearly as good (heuristic baselines).
  s5_verdict: confirmed
  s5_evidence: Rendezvous extension by chasing pays only for <12 h (weather_analysis); greedy max-wind
    chasing gives CF 34 % vs 59 % for the fixed point (sensitivity_table).
- id: H-2-2
  v1_section: 2.1.2, 3.5
  category: problem-structure
  statement: The value of a position depends on the flux of systems that will cross it in following days,
    almost not on the wind present there now.
  type: assumption
  used_for: D2, D1 (value function is non-local and non-stationary)
  criticality: high
  evidence_so_far: 'S2 diag (synthetic): cell-by-cell correlation of the 13 d value map with the clairvoyant
    one only 0.04-0.7 per date. S4 V_theta: within-release R2 0.38 with smoothed FORECAST hold power the
    top feature (33 % gain) - forecast state matters; climatology within-release R2 0.24.'
  test: 'E-13/E-08: regress realised 5-10 d energy on (a) current wind at x, (b) forecast mean P over
    next 5 d, (c) climatology, by season; compute Eulerian vs Lagrangian persistence of productive conditions.'
  test_cost: medium
  status: confirmed
  notes: Our terminals are 5 d horizons; the claim at 10-15 d is untouched. If persistence of 'productive'
    conditions is long (blocking, regimes), the claim is weaker than v1 states.
  s5_verdict: confirmed
  s5_evidence: 'Hold-oracle explains 71-80 % of the oracle advantage over B0 (weather_analysis): the value
    of a position is the flux of systems over the next days; terminal value from the annual climatology
    is worth +2.6 pt (z -5.8 when removed) with a 5 d horizon.'
- id: H-2-3
  v1_section: 2.1.3
  category: weather
  statement: Westward legs sit at TWA 30-70 deg (weak zone) and eastward legs at 90-130 deg, so it is
    optimal to 'spend west early' and harvest while drifting east.
  type: assumption
  used_for: D2, F-legs, return constraint ('capital of longitude')
  criticality: medium
  evidence_so_far: 'BETA polar: P(TWA 45) ~ 0 and P(60) = 0.65 MW at 20 kn vs 2.6 MW at 90 deg (S3 polar
    notes; this review). No mission analysis of longitude vs time yet. S4 first 72 h from Lorient yields
    only 1.54 MW avg vs 2.3 MW later (outputs/s4_runs B_B1c_*).'
  test: 'E-13/E-16: from existing S3/S4 tracks compute longitude vs time, heading histogram vs TWA, and
    CF by heading sector; test whether ships drift east with systems and ''recharge'' west.'
  test_cost: cheap
  status: deferred
  notes: Moot for the persistent fleet (no return) except for legs; strongly depends on the polar shape
    (asymmetric peak at 95-110 deg).
  s5_verdict: deferred
  s5_evidence: Leg-direction statistics (TWA by heading) were not extracted from the S5 runs; the persistent
    core has no westward/eastward legs to compare. To measure on fleet-logistics runs (S6).
- id: H-2-4
  v1_section: 2.2.1, 1.3
  category: ship/polar
  statement: 'The optimum is sharp and narrow: >2400 kW only at beam reach TWA 75-105 deg, P(45 deg) =
    P(90 deg)/3-4, half-width +-20-25 deg, a 30 deg error costs ~50 %.'
  type: quantitative-claim
  used_for: D3 (vector clustering), F1 polar narrative
  criticality: high
  evidence_so_far: 'BETA (S3, plot_beta_polar; re-checked in S5): at 20 kn peak 2756 kW at TWA 95; P(45)~0
    (not 1/3); P>=0.9 peak only 88-105; P>=0.5 peak 70-135 (asymmetric). Above 24 kn the plateau widens
    (26 kn: >=0.9 peak at 88-140 deg; 35 kn: 80-180 deg; downwind 170 deg = 1.5 MW at 26 kn, 2.5 MW at
    30 kn). S0 already flagged the claims as mutually inconsistent.'
  test: 'Done for the shape (BETA). Next: E-10 polar perturbations (sharper/flatter peak) and E-12 to
    check whether directional accuracy still dominates in 18-26 kn only; measure real directional sensitivity
    of regret.'
  test_cost: cheap
  status: contradicted-by-S0-S4
  notes: Narrow only below ~22 kn; in strong wind most of the downwind half-plane is productive (S3 finding
    3). The 'beam-reach / rendezvous' narrative and the choice to cluster on direction are not justified
    in winter; polar numbers in v1 are for an illustrative model.
- id: H-2-5
  v1_section: 2.2.1 pt 2-3
  category: ship/polar
  statement: Peak power is ~1500 kW at 18 kn, 2100 at 20, >2700 at 22, cubic in TWS (~15 %/kn); the 3
    MW plateau starts around 24-26 kn.
  type: quantitative-claim
  used_for: D1, DIM (sweet-spot band 18-26 kn, knee 24-26 kn)
  criticality: medium
  evidence_so_far: 'BETA: 2008 kW at 18 kn, 2756 at 20, 2986 at 22, 2984 flat to 50 kn (S5 re-computation).
    Cubic confirmed (14->20 kn exponent 3.0); gain 17 %/kn at 18-20 kn, 26 %/kn at 12-14 kn; knee at 21-22
    kn not 24-26.'
  test: 'Done (BETA table). Consequence to test in E-13: share of time TWS>=21 kn by season (S4: ships
    spend 48 % of the year at P>2800 kW).'
  test_cost: cheap
  status: contradicted-by-S0-S4
  notes: 'Real band is ''>= ~21 kn'' not ''18-26 kn'': stronger wind is free energy (plateau) and the
    interesting regime is the transition 12-21 kn. Our BETA already contains the generator limit.'
- id: H-2-6
  v1_section: 2.2.1 pt 4
  category: ship/polar
  statement: Net power is negative up close to the wind (down to -300 kW), so upwind repositioning has
    an explicit energy price.
  type: quantitative-claim
  used_for: D2 (cost of repositioning against the wind)
  criticality: medium
  evidence_so_far: 'BETA: max-over-U power at TWA<=45 deg is -1 to -43 kW (about zero), but individual
    (TWA, U) nodes reach -3500 kW (PolarTable bounds must be (-3500, 3000)); beam reach at U=8 m/s already
    -800 kW. Hence the price is lost production while travelling, not large negative power.'
  test: 'E-13: energy cost of an upwind transit of 300 NM computed along realised tracks; E-10 sensitivity
    to the near-zero upwind power.'
  test_cost: cheap
  status: contradicted-by-S0-S4
  notes: A ship that slows down is never forced into the -3 MW nodes; the 'explicit price' is the opportunity
    cost of transit time.
- id: H-2-7
  v1_section: 2.2.1 pt 6, 2.6.1
  category: ship/polar
  statement: 'Production needs ship motion (optimum at 6-9 kn): a nearly stopped ship produces almost
    nothing and cannot hold position; hold = beam-reach tacks with zero mean ground speed.'
  type: quantitative-claim
  used_for: D10 (no station keeping at standstill; hold by tacking)
  criticality: medium
  evidence_so_far: 'BETA 20 kn, TWA 90: U=1 m/s gives 46 kW, 3-4 m/s gives 2.4 MW, 8 m/s -800 kW. U* at
    16-20 kn TWS = 5.3-6.8 kn (3.4 kn at 10 kn TWS). S3: ''hold = beam-reach tacks at 3.5-4 m/s''; hold
    envelope 2.46 MW at 20 kn.'
  test: E-09 (explicit tack simulation vs convex-hull envelope).
  test_cost: cheap
  status: supported-by-S0-S4
  notes: Supported by the polar itself. Optimum speed is 5-7 kn rather than 6-9 kn for TWS<=20 kn.
- id: H-2-8
  v1_section: 2.2.1 pt 2, 2.3
  category: ship/polar
  statement: One extra knot of true wind speed is worth about 15 % of power below the knee.
  type: quantitative-claim
  used_for: D3 (Jensen), DIM
  criticality: low
  evidence_so_far: 'BETA: +26 %/kn (12->14 kn), +19 %/kn (14->16), +17 %/kn (18->20), 0 above 22 kn (S5).'
  test: Done; propagate into E-10 (wind bias +-1 kn).
  test_cost: cheap
  status: confirmed
  notes: Order of magnitude right, understated at low wind; zero in the plateau.
  s5_verdict: confirmed
  s5_evidence: 'Polar sensitivity of the mission: +-10 % truth power -> +-8.1 pt CF (z 20); consistent
    with a steep power-speed relation below the knee (S4 propagation).'
- id: H-2-9
  v1_section: 2.2.3, 4.4.1
  category: ship/polar
  statement: 'The polar is concave above the knee and around the optimum and convex below, so E[P(W)]
    differs from P(E[W]) with a regime-dependent sign: deterministic routing is biased, ensembles are
    required beyond ~D2.'
  type: assumption
  used_for: D3 (ensemble scenarios; 'Jensen argument is the strongest')
  criticality: high
  evidence_so_far: 'S5 computation on BETA max-over-U power with Gaussian TWS sd 4 kn: E[P]/P(mean) =
    1.19 at 14 kn, 0.97 at 18, 0.85 at 20, 0.88 at 22, 0.99 at 30 (sign flips near 18 kn; scalar TWS only,
    direction ignored). Closed loop: ensemble gain small (+1.2 % year n.s.; +0.65 % matched, S3) - Jensen
    bias never isolated.'
  test: 'E-13: measure the bias along ship tracks with the forecast ensemble: planned energy of members
    vs of their mean; E-11: DP on ensemble-mean field vs scenario DP.'
  test_cost: medium
  status: nuanced
  notes: Jensen bias +-15-19 % at sd 4 kn is real on the polar but small after averaging over a route
    and over positions; may not change position RANKING, which is what routing needs.
  s5_verdict: nuanced
  s5_evidence: 'Not measured directly. Indirect: intensity-type forecast errors (amplitude + noise) cost
    10.4 pt more than displacement errors of equal variance, consistent with a non-linear (concave/convex)
    polar making E[P(W)] != P(E[W]); ENS gains +1.9 pt in that regime.'
- id: H-2-10
  v1_section: 2.2.3
  category: algorithm-choice
  statement: A deterministic optimiser is attracted to high-mean, high-variance configurations (core of
    forecast lows) where overestimation is maximal.
  type: assumption
  used_for: D3 (adverse optimisation bias / winner's curse)
  criticality: medium
  evidence_so_far: 'S2 diag (synthetic only): plan optimism at t0 = +18 % (B1_5d), +30 % (B1_15d, ENS
    g0, per-scenario clairvoyance beyond 48 h). Real-ERA5 runs: planned vs realised not analysed.'
  test: 'E-14: log planned (DP/refiner) energy vs realised over the next 48 h and 5 d for each replan
    of S4 runs/new runs, by policy and season; test dependence on forecast spread.'
  test_cost: medium
  status: nuanced
  notes: Our ensemble DP is as optimistic as deterministic planning, contrary to the v1 story.
  s5_verdict: nuanced
  s5_evidence: ENS (risk-neutral and CVaR gamma 0.3) does not beat B1c at nominal error (+0.0 pt, n.s.;
    gamma 0.3 +1.7 pt, z 1.3 n.s.); with intensity-type errors ENS gains +1.9 pt. The attraction exists
    but is second-order at our error level.
- id: H-2-11
  v1_section: 2.2.6
  category: ship/polar
  statement: TWA = arccos(W.U/|W||U|) with W in the 'toward' convention.
  type: quantitative-claim
  used_for: conventions (TWA formula)
  criticality: medium
  evidence_so_far: 'S0: gives 0 deg for downwind, an error of 180 deg versus the polar convention (0 =
    head to wind); code uses arccos(-W.e/|W|). BETA files confirm Psi = TWA via AWS^2 = TWS^2+U^2+2 TWS
    U cos(Psi) (S3).'
  test: Done (unit tests, test_polar_beta).
  test_cost: cheap
  status: contradicted-by-S0-S4
  notes: A literal implementation would swap upwind and downwind - catastrophic but already neutralised.
- id: H-2-12
  v1_section: 2.2.6, 2.6.4
  category: ship/polar
  statement: Leeway is k_L|W| (k_L = 2-5 % of wind) on the leeward normal; current 0.2-0.8 kn; both must
    be compensated by a 5-10 deg bias.
  type: assumption
  used_for: D10, drift compensation
  criticality: medium
  evidence_so_far: 'S0: literal form discontinuous -> k_L |W| sin(TWA) used, k_L = 0.03 hypothesis; hold
