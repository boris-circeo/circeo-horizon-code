  test_cost: expensive
  status: deferred
  notes: Every conclusion on horizon, ensemble value and latency inherits this unverified law.
  s5_verdict: deferred
  s5_evidence: Our forecast errors are synthetic (calibrated on literature); verification needs real archived
    forecasts (GEFS reforecast / ECMWF ENS) - S5.x data request.
- id: H-2-23
  v1_section: 1.6, 2.8.2
  category: forecast
  statement: The useful horizon for 10 m wind is ~D5-6 deterministic and D8-10 probabilistic.
  type: quantitative-claim
  used_for: 'D1 (horizon design: deterministic useful to D5-6, probabilistic to D8-10)'
  criticality: high
  evidence_so_far: 'S1 synthetic: B1_15d worse than B1_5d (16.2 vs 12.6 % regret) but on 10 d windows
