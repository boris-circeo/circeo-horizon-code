  type: dismissed-alternative
  used_for: 'D5 (Zermelo-derived methods: isochrones, fast marching, level sets are not transferable)'
  criticality: medium
  evidence_so_far: Theoretical argument only. No isochrone/FMM benchmark was built; our DP is exact on
