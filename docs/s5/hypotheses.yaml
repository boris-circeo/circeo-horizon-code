  test_cost: medium
  status: refuted
  notes: Result tied to our forecast law (error saturates at D7).
  s5_verdict: refuted
  s5_evidence: 'B1 at 10 d is not worse than at 5 d (80.3 vs 79.9 %, n.s.) when the refiner and the terminal
    value are present: an over-long horizon is harmless, merely useless.'
- id: H-4-3
  v1_section: 4.2.2
  category: algorithm-choice
