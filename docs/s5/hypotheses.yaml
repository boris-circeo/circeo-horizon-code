  criticality: high
  evidence_so_far: Our perturbation model is calibrated on 'ballpark ECMWF ENS' RMSE targets (control
    2.2/3.8/5.2/6.0 m/s at D1/3/5/7), NOT fitted to real reforecasts (forecast_model.py).
  test: 'E-20: compare the model with real archived forecasts (GEFS v12 reforecast 2015 via AWS; ECMWF/ERA5-EDA
