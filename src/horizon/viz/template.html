<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--__TITLE__--></title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#e1e5ec;--grid:#e9ecf2;--accent:#2f5fd0;
--land:#b9b4a8;--buf:#8d887c;--band:rgba(245,170,20,.16);--sea:#eaf0f7;--hl:#fff7d6;--bad:#c4332b;--good:#1d7a4c}
body.dark{--bg:#12151c;--card:#1b2029;--ink:#e6e9f0;--mute:#98a2b3;--line:#2b3240;--grid:#262c38;--accent:#7aa2ff;
--land:#4a4a46;--buf:#3a3a36;--band:rgba(245,170,20,.14);--sea:#1b2433;--hl:#3a3320;--bad:#ff7b72;--good:#58d68d}
*{box-sizing:border-box}
html{font-size:13px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:0.615rem 1.385rem;align-items:center;padding:0.769rem 1.231rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
h1{font-size:1.231rem;margin:0}
.meta{color:var(--mute);font-size:0.923rem}
.tabs{display:flex;gap:0.308rem;margin-left:auto}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:0.462rem;padding:0.308rem 0.769rem;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:0.462rem 1.077rem;align-items:center;padding:0.615rem 1.231rem;border-bottom:1px solid var(--line);background:var(--card)}
.chip{display:inline-flex;align-items:center;gap:0.385rem;padding:0.154rem 0.692rem 0.154rem 0.462rem;border:1px solid var(--line);border-radius:7.615rem;cursor:pointer;user-select:none}
.chip.off{opacity:.4}
.dot{width:0.769rem;height:0.769rem;border-radius:50%;display:inline-block}
main{padding:0.923rem 1.231rem;margin:0 auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0.923rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(29.231rem,1fr));gap:0.923rem}
@media(max-width:80.769rem){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:0.769rem;padding:0.769rem 0.923rem;margin-bottom:0.923rem;min-width:0}
.card h2{font-size:1rem;margin:0 0 0.462rem;display:flex;gap:0.769rem;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mute)}
table{border-collapse:collapse;width:100%}
th,td{padding:0.231rem 0.615rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:0.923rem}
td.best{font-weight:700;color:var(--good)}
td.worst{color:var(--bad)}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--hl)}
.tw{overflow-x:auto}
canvas{display:block;border-radius:0.462rem;border:1px solid var(--line)}
svg{display:block;width:100%;overflow:visible}
svg text{fill:var(--mute);font-size:0.808rem}
svg .ax{stroke:var(--line)}svg .gl{stroke:var(--grid)}
svg .cur{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 2;pointer-events:none}
.row{display:flex;gap:0.769rem;align-items:center;flex-wrap:wrap;margin:0.308rem 0}
input[type=range]{flex:1;min-width:12.308rem}
.ro{font-variant-numeric:tabular-nums}
.hint{color:var(--mute);font-size:0.885rem;margin:0.154rem 0 0.462rem}
.legend{display:flex;gap:0.769rem;flex-wrap:wrap;font-size:0.885rem;color:var(--mute)}
label.ck{display:inline-flex;gap:0.308rem;align-items:center;cursor:pointer}
.mini{display:inline-block;vertical-align:middle}
.kv{table-layout:auto}.kv td:last-child{text-align:left;white-space:normal;word-break:break-word}.kv td{padding:1px 0.462rem}
.err{padding:2.308rem;color:var(--bad);font-size:1.154rem}
.cap{color:var(--mute);font-size:0.885rem;margin:-2px 0 0.462rem;line-height:1.35}
.ii{display:inline-block;width:1rem;height:1rem;border:1px solid var(--mute);border-radius:50%;font:italic 600 0.692rem/0.846rem Georgia,serif;text-align:center;color:var(--mute);cursor:help;margin-left:0.308rem;vertical-align:middle;font-weight:600}
.ii:hover{color:var(--accent);border-color:var(--accent)}
.term{border-bottom:1px dotted var(--mute);cursor:help}
#pop{position:fixed;z-index:60;max-width:24.615rem;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 0.308rem 1.385rem rgba(0,0,0,.25);border-radius:0.615rem;padding:0.615rem 0.769rem;font-size:0.923rem;display:none}
#pop a,.gbody a{color:var(--accent);cursor:pointer;text-decoration:underline}
#chips{display:flex;flex-wrap:nowrap;gap:0.462rem;padding:0.462rem 1.231rem 0;align-items:center;overflow:hidden}
#chips:empty{display:none}
.chip2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;font-size:0.885rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:0.231rem solid #d6a21e;border-radius:0.462rem;padding:0.154rem 0.615rem;cursor:pointer}
.chip2:hover{border-color:var(--accent)}
#guide{position:fixed;top:0;right:0;bottom:0;width:min(38.462rem,94vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 1.846rem rgba(0,0,0,.18);z-index:40;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
#guide.open{transform:none}
.ghead{display:flex;gap:0.615rem;align-items:center;padding:0.769rem 1.077rem;border-bottom:1px solid var(--line)}
.gnav{display:flex;flex-wrap:wrap;gap:0.308rem 0.769rem;padding:0.462rem 1.077rem;border-bottom:1px solid var(--line);font-size:0.885rem}
.gnav a{color:var(--accent);cursor:pointer}
.gbody{overflow:auto;padding:0.308rem 1.231rem 3.077rem;font-size:1rem;line-height:1.5}
.gbody h2{font-size:1.154rem;margin:1.538rem 0 0.462rem;padding-top:0.462rem;border-top:1px solid var(--line)}
.gbody h3{font-size:1rem;margin:1.077rem 0 0.308rem}
.gbody p{margin:0.308rem 0}.gbody ul,.gbody ol{margin:0.308rem 0;padding-left:1.538rem}
.gbody table{font-size:0.885rem;margin:0.462rem 0}.gbody th,.gbody td{text-align:left;white-space:normal}
.gbody .flash{background:var(--hl)}
.badge{font-size:0.808rem;font-weight:400;color:var(--good);border:1px solid var(--line);border-radius:7.615rem;padding:0 0.462rem;margin-left:0.462rem}
.badge.no{color:var(--mute)}
.fig{margin:.8rem 0;padding:.5rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg)}.fig svg{width:100%;height:auto;max-height:14rem;display:block}.fig figcaption{font-size:.92rem;margin-top:.3rem}
#primer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}#primer .pbox{background:var(--card);border-radius:.8rem;padding:1.2rem;width:min(40rem,94vw);box-shadow:0 .5rem 2rem rgba(0,0,0,.4)}#primer .fig{border:none;background:none}#primer svg{max-height:17rem}#primer .pbox{max-height:94vh;overflow:auto}#primer .tfig svg,#primer .tfig img{max-height:48vh}
#tour{position:fixed;right:1.231rem;bottom:1.231rem;z-index:70;width:24.615rem;background:var(--card);border:1px solid var(--accent);border-radius:0.769rem;padding:0.923rem;box-shadow:0 0.462rem 1.846rem rgba(0,0,0,.3);display:none}
#tour .row{justify-content:flex-end;margin-bottom:0}
.tour-hl{outline:0.154rem solid var(--accent);outline-offset:0.154rem;border-radius:0.462rem}
.q{font-size:0.769rem;color:var(--mute);border:1px solid var(--line);border-radius:50%;width:1rem;height:1rem;display:inline-block;text-align:center;line-height:0.846rem;margin-left:0.231rem}
#exgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:.9rem;align-items:start}
#exgrid .c3{grid-column:1/-1}
#ovgrid{display:grid;grid-template-columns:1fr;gap:0 .9rem}
@media(min-width:1100px){#ovgrid{grid-template-columns:1fr 1fr}#ovgrid .ov-wide{grid-column:1/-1}}
body.wide{--wide:1}
body.wide #exgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
body.wide #exgrid .c3{grid-column:auto;max-height:calc(100vh - 11rem);overflow:auto}
body.wide #exgrid .c3 .grid3{grid-template-columns:1fr 1fr}
body.wide #ovgrid .ov-wide{grid-column:auto}
body.wide #ovgrid{grid-template-columns:1.35fr 1fr}
body.wide .card{margin-bottom:.9rem}
.zoom button{padding:.1rem .45rem}
#map{margin:0 auto}
.mapw{position:relative;display:flex;justify-content:center}
#mapfx,#scfx{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none;border-color:transparent;background:transparent}

/* ---------------------------------------------------------------- Showcase tab (dark, premium) */
.ver{font-size:.85rem;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:2rem;padding:.1rem .7rem;white-space:nowrap}body.showcase .ver{display:none}
.brand{display:none;font-weight:300;letter-spacing:.42em;font-size:1.05rem}
body.showcase{--bg:#05080f;--card:#0b1220;--ink:#eef2f9;--mute:#8c98ad;--line:rgba(255,255,255,.09);--grid:rgba(255,255,255,.06);--accent:#58c4ff;--hl:#12203a;
 background:radial-gradient(70rem 36rem at 12% -8%,rgba(40,90,170,.34),transparent 60%),radial-gradient(60rem 34rem at 100% 4%,rgba(110,50,150,.22),transparent 60%),#05080f}
body.showcase header{background:rgba(5,8,15,.72);backdrop-filter:blur(14px);border-bottom-color:rgba(255,255,255,.07)}
body.showcase #ttl,body.showcase #meta,body.showcase #bar,body.showcase #chips,body.showcase #theme{display:none}
body.showcase .brand{display:inline}
body.showcase main{padding:0}
.sc{font-family:Inter,"SF Pro Display",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;max-width:122rem;margin:0 auto;padding:0 2.2rem 4rem}
.sc>section{animation:scin .9s cubic-bezier(.2,.7,.2,1) both}
.sc>section:nth-child(2){animation-delay:.12s}.sc>section:nth-child(3){animation-delay:.24s}.sc>section:nth-child(4){animation-delay:.36s}.sc>section:nth-child(5){animation-delay:.48s}
@keyframes scin{from{opacity:0;transform:translateY(1.6rem)}to{opacity:1;transform:none}}
.sc-hero{padding:2.8rem 0 1.4rem;position:relative}
.sc-eyebrow{letter-spacing:.34em;font-size:.82rem;color:var(--accent);font-weight:600;text-transform:uppercase}
.sc-hero h2{font-size:3.6rem;line-height:1.05;font-weight:300;letter-spacing:-.025em;margin:.7rem 0 .9rem;background:linear-gradient(100deg,#fff 20%,#9fd8ff 70%,#d9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc-sub{font-size:1.45rem;line-height:1.5;color:#b4c0d4;max-width:62rem;font-weight:300}
.sc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.1rem;margin-top:1.6rem}
.sc-kpi{padding:1.5rem 1.6rem 1.3rem;border-radius:1.2rem;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));position:relative;overflow:hidden}
.sc-kpi::after{content:"";position:absolute;right:-3rem;top:-3rem;width:9rem;height:9rem;border-radius:50%;background:radial-gradient(circle,rgba(88,196,255,.22),transparent 70%)}
.sc-num{font-size:3.7rem;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.sc-num small{font-size:1.9rem;font-weight:300;color:#9fd8ff;margin-left:.25rem;letter-spacing:0}
.sc-lab{margin-top:.75rem;font-size:1.08rem;color:#d3dbe9;font-weight:500}
.sc-lab2{font-size:.9rem;color:var(--mute);margin-top:.15rem}
.sc-facts{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.4rem}
.sc-pill{display:inline-flex;align-items:center;gap:.55rem;padding:.4rem 1rem;border-radius:2rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#c4cfe2;font-size:.95rem}
.sc-pill i{width:.55rem;height:.55rem;border-radius:50%;background:#58e0a8;box-shadow:0 0 .7rem #58e0a8}
.sc-gear{position:absolute;right:0;top:1.4rem}
.sc-gear button{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#aeb9cc;border-radius:2rem;padding:.35rem .9rem}
.sc-menu{position:absolute;right:0;top:4.2rem;z-index:20;width:21rem;padding:1rem 1.1rem;border-radius:1rem;background:rgba(14,20,34,.96);border:1px solid rgba(255,255,255,.12);box-shadow:0 1rem 3rem rgba(0,0,0,.5);display:none}
.sc-menu.open{display:block}.sc-menu label{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin:.55rem 0;color:#c4cfe2;font-size:.95rem}
.sc-stage{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(19rem,1fr);gap:1.3rem;margin-top:1.2rem;align-items:start}
.sc-card{border-radius:1.2rem;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));padding:1.2rem 1.3rem}
.sc-side{position:sticky;top:4.6rem}
.sc-card h3{margin:0 0 .2rem;font-size:1.25rem;font-weight:500;letter-spacing:-.01em;color:#fff}
.sc-card .sc-note{color:var(--mute);font-size:.92rem;margin-bottom:.8rem}
.sc-mapcard{padding:.8rem;position:relative;overflow:hidden}
.sc-mapcard canvas{border:none;border-radius:.9rem}
.sc-date{position:absolute;left:2rem;top:1.6rem;pointer-events:none;text-shadow:0 .1rem 1rem rgba(0,0,0,.8)}
.sc-date b{display:block;font-size:2.5rem;font-weight:300;letter-spacing:-.02em;color:#fff}
.sc-date span{font-size:.95rem;color:#dbe4f3;letter-spacing:.04em}
.sc-ctl{display:flex;align-items:center;gap:1rem;margin:.8rem .4rem .2rem}
.sc-ctl button{width:2.8rem;height:2.8rem;padding:0;border-radius:50%;background:rgba(88,196,255,.14);border-color:rgba(88,196,255,.5);display:flex;align-items:center;justify-content:center}
.sc-ctl button svg{width:1.1rem;height:1.1rem;fill:#dff2ff}
.sc-ctl input[type=range]{accent-color:#58c4ff;min-width:8rem}
.sc-live{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.5rem}
.sc-live div{text-align:left}.sc-live b{display:block;font-size:1.9rem;font-weight:300;font-variant-numeric:tabular-nums;color:#fff}.sc-live span{font-size:.82rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.sc-bar{margin:.85rem 0 0}.sc-bar .l{display:flex;justify-content:space-between;font-size:.95rem;color:#d3dbe9}.sc-bar .l b{font-weight:500;font-variant-numeric:tabular-nums}
.sc-bar .t{height:.55rem;border-radius:.4rem;background:rgba(255,255,255,.07);margin-top:.3rem;overflow:hidden}.sc-bar .t i{display:block;height:100%;border-radius:.4rem;width:0}
.sc-delta{margin-top:1rem;padding-top:.9rem;border-top:1px solid rgba(255,255,255,.08);font-size:.95rem;color:#c4cfe2}.sc-delta b{font-size:1.6rem;font-weight:300;color:#7be0b0}
.sc-key{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem;font-size:.88rem;color:var(--mute);line-height:1.35}.sc-key b{color:#dbe4f3;font-weight:500}
.sc-chart{margin-top:1.3rem}.sc-chartwrap{position:relative}
.sc-leg{display:flex;gap:1.4rem;flex-wrap:wrap;margin:.2rem 0 .6rem;color:#c4cfe2;font-size:.95rem}.sc-leg i{display:inline-block;width:1.4rem;height:.2rem;border-radius:.2rem;vertical-align:middle;margin-right:.45rem}
.sc-tip{position:absolute;pointer-events:none;display:none;padding:.5rem .8rem;border-radius:.6rem;background:rgba(14,20,34,.95);border:1px solid rgba(255,255,255,.14);font-size:.9rem;line-height:1.5;white-space:nowrap;z-index:5}
.sc-row4{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.1rem;margin-top:1.3rem}
.sc-item{padding:1.3rem 1.3rem 1.2rem;border-radius:1.1rem;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}
.sc-item svg{width:2.7rem;height:2.7rem;stroke:#58c4ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.7rem}
.sc-item b{display:block;font-size:1.12rem;font-weight:500;color:#fff;margin-bottom:.25rem}.sc-item span{color:#aab6ca;font-size:.97rem;line-height:1.45}
.sc-sec{margin:2.6rem 0 .2rem;font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sc-foot{margin-top:2.4rem;color:#6f7c92;font-size:.85rem;line-height:1.5;max-width:90rem}
@media(max-width:80rem){.sc-stage{grid-template-columns:1fr}.sc-hero h2{font-size:2.8rem}}
.tfig{margin:1rem 0;padding:.6rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg)}
.tfig .tfimg{cursor:zoom-in}.tfig svg,.tfig img{width:100%;height:auto;max-height:26rem;display:block}.tfig h4{margin:.4rem 0 .2rem}
#lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:2rem;cursor:zoom-out}
#lightbox .lb{background:var(--card);color:var(--ink);border-radius:.8rem;padding:1.2rem;max-width:min(96vw,110rem);max-height:94vh;overflow:auto}
#lightbox svg,#lightbox img{width:100%;height:auto;max-height:72vh;display:block}

/* ---------------------------------------------------------------- Showcase playback controls */
.sc-tlw{flex:1;position:relative;padding-bottom:1.35rem;min-width:0}.sc-tlw input{margin:0;width:100%;display:block}
.sc-ticks{position:absolute;left:0;right:0;bottom:0;height:1.2rem;pointer-events:none}
.sc-ticks span{position:absolute;bottom:0;transform:translateX(-50%);font-size:.78rem;color:#8c98ad;letter-spacing:.04em}
.sc-ticks i{position:absolute;top:-.15rem;width:1px;height:.35rem;background:rgba(255,255,255,.22)}
.sc-ctl2{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.3rem .4rem .1rem}
.sc-seg{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:2rem;overflow-x:auto;max-width:100%;scrollbar-width:none}
.sc-seg::-webkit-scrollbar{display:none}
.sc-seg button{border:none;border-radius:0;background:transparent;color:#aeb9cc;padding:.4rem .95rem;white-space:nowrap;flex:0 0 auto}
.sc-seg button+button{border-left:1px solid rgba(255,255,255,.08)}
.sc-seg button.on{background:rgba(88,196,255,.22);color:#fff}
.sc-hint{font-size:.85rem}
/* ---------------------------------------------------------------- responsive: tablet and phone, touch */
button,select,input{touch-action:manipulation}
.tw td:first-child,.tw th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
body.showcase .tw td:first-child,body.showcase .tw th:first-child{background:#0b1220}
.ii{position:relative}.ii::after{content:"";position:absolute;inset:-.7rem}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;white-space:nowrap}
@media(pointer:coarse){.row.legend{gap:0 .8rem}button,select,.chip,label.ck{min-height:44px}input[type=range]{min-height:44px}.chip{padding-top:.3rem;padding-bottom:.3rem}.sc-hint{display:none}.sc-ctl button{width:3.2rem;height:3.2rem;min-height:0}}
@media(max-width:900px){
 header{gap:.35rem .8rem;padding:.5rem .8rem}
 #meta{display:none}
 h1{font-size:1.05rem;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tabs{order:5;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:.15rem}
 .zoom{display:none}
 main{padding:.6rem}
 .bar{padding:.5rem .8rem}
 #chips{overflow-x:auto;padding:.4rem .8rem 0}
 .card{padding:.7rem}
 .grid3,#exgrid{grid-template-columns:minmax(0,1fr)}
 #guide{width:100vw;border-left:none}
 .gnav{overflow-x:auto;white-space:nowrap;flex:0 0 auto;padding-bottom:.4rem}
 .chip2{flex:0 0 auto;max-width:78vw}
 #pop{max-width:calc(100vw - 1rem)}
 #tour{left:.6rem;right:.6rem;width:auto;bottom:.6rem}
 #primer .pbox,#lightbox .lb{width:calc(100vw - 1rem)}
 #occ{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem!important}
 #occ>div{min-width:0}
 .sc{padding:0 .9rem 2.5rem}
 .sc-hero{padding:1.2rem 0 .8rem}
 .sc-hero h2{font-size:2.2rem}.sc-sub{font-size:1.05rem}

<script>
"use strict";

/* inline rich text: **bold**, [[term]] or [[term|label]] -> glossary term, [label](#section) -> guide link */

}
const cap = id => G.captions[id] ? `<div class="cap">${rich(L(G.captions[id]))}</div>` : "";
const ERA = () => D.meta.weather_kind === "era5";

// ------------------------------------------------------------------ data loading

      for (let k = 1; k < n; k++) { x += dd[q++]; y += dd[q++]; a[2 * k] = lv.origin_km[0] + x * u; a[2 * k + 1] = lv.origin_km[1] + y * u; } mp.LV.push(a); });
  }

    const nx = g.nx, ny = g.ny, R = 8; let A = Float32Array.from(mp.M), Bq = new Float32Array(nx * ny);

}

// ------------------------------------------------------------------ derived quantities
const dtS = () => D.meta.export_dt_s;
const seed = () => D.seeds[S.si];
const run = (s, n) => s.runs[n];

function jRef(s) { const r = refRun(s); return r ? r.metrics.energy_kwh : NaN; }
const METRICS = {
  CF: {label: "Capacity factor CF [%]", d: 1, hi: true, f: r => 100 * r.metrics.capacity_factor},
  J: {label: "Energy J [MWh]", d: 1, hi: true, f: (r, s) => r.metrics.energy_kwh / 1e3},
  REG: {label: "Gap to reference [pts]", d: 1, hi: false, f: (r, s) => { const q = refRun(s); return q ? 100 * (q.metrics.capacity_factor - r.metrics.capacity_factor) : NaN; }},
  HOLD: {label: "Time in hold [%]", d: 0, hi: null, f: r => 100 * r.diag.hold_share},
  PROD: {label: "Productive band [% time]", d: 1, hi: true, f: r => 100 * r.diag.productive_share},
  TWSB: {label: "TWS 18-26 kn [% time]", d: 1, hi: true, f: r => 100 * r.diag.tws_band_share},
  SPD: {label: "Mean speed [kn]", d: 2, hi: null, f: r => r.diag.mean_speed_ms / KN},
  DIST: {label: "Distance [km]", d: 0, hi: null, f: r => r.metrics.distance_km},
  TWS: {label: "Mean experienced TWS [kn]", d: 1, hi: true, f: r => r.diag.mean_tws_ms / KN}

function metricVals(name, key) { // per seed values (NaN if missing)
  return D.seeds.map(s => s.runs[name] ? METRICS[key].f(s.runs[name], s) : NaN);
}
const fin = a => a.filter(isFinite);
function interp(arr, tf) { // arr indexed by export step; fractional index
  const i = clamp(Math.floor(tf), 0, arr.length - 2), a = clamp(tf - i, 0, 1);
  return arr[i] * (1 - a) + arr[i + 1] * a;
}
function movavg(a, w) {
  if (w <= 1) return a;
  const out = new Float64Array(a.length), h = Math.floor(w / 2);
  for (let i = 0; i < a.length; i++) {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - h); j <= Math.min(a.length - 1, i + h); j++) if (isFinite(a[j])) { s += a[j]; c++; }

}
function gap(s, n) { // accumulated energy lost vs reference [kWh] at each sample
  const r = run(s, n), ref = refRun(s);

}
function dailyLoss(s, n) {
  const g = gap(s, n); if (!g) return null;
  const per = Math.round(DAY / dtS()), out = [];
  for (let d = 0; d * per < g.length - 1; d++) out.push(g[Math.min((d + 1) * per, g.length - 1)] - g[d * per]);

}
function topLosses(s, n, wH, k = 5) {
  const g = gap(s, n); if (!g) return [];
  const w = Math.max(1, Math.round(wH * 3600 / dtS())), L = [];
  for (let i = 0; i + w < g.length; i++) L.push([g[i + w] - g[i], i]);

  for (const [v, i] of L) {
    if (v <= 0 || picked.length >= k) break;
    if (picked.every(p => Math.abs(p.i - i) >= w)) picked.push({loss: v, i, w});

    p.hold = sl(r.H); p.tws = sl(r.TWS) / KN; p.pw = sl(r.P); p.pref = sl(ref.P); p.twsref = sl(ref.TWS) / KN;

function clock(tf) {

// ------------------------------------------------------------------ SVG chart helpers
function niceTicks(lo, hi, n = 5) {

/* UI scale: root font size follows the viewport width (13 px laptop .. 18 px 4K) times the user zoom. */

/* Generic bar/line chart with categories; returns svg string. */
function barsSvg(W, H, cats, series, o = {}) { // series: [{name,color,v:[per cat]}]

  let lo = 0, hi = -Infinity, mn = 0;

// -- time series
function buildTS() {

  const lossWin = S.focus ? topLosses(s, S.focus, S.win).map(p => [p.i * dtS() / DAY, (p.i + p.w) * dtS() / DAY]) : [];
  tsChart($("#ts-power"), {title: "Power", ylabel: "kW", series: mkS(r => movavg(r.P, sm), tb), x: tb, xmax, height: 110});
  tsChart($("#ts-energy"), {title: "Cumulative energy", ylabel: "MWh", series: mkS(r => r.E.map(v => v / 1e3), days), x: days, xmax, height: 110});
  tsChart($("#ts-gap"), {title: "Gap to " + S.ref + " (accumulated)", ylabel: "MWh lost - rising = losing energy", zero: true, shade: lossWin,
    series: mkS((r, n) => { const g = gap(s, n); return g ? g.map(v => v / 1e3) : r.E.map(() => NaN); }, days).filter(q => q.name !== S.ref), x: days, xmax, height: 120});
  tsChart($("#ts-tws"), {title: "TWS experienced", ylabel: "kn", series: mkS(r => movavg(r.TWS, sm).map(v => v / KN), tb), bands: [D.meta.productive.tws_kn], x: tb, xmax, height: 110, ymin: 0});
  tsChart($("#ts-twa"), {title: "TWA experienced (course vs wind)", ylabel: "deg, gaps = hold", series: mkS(r => movavg(r.TWA, sm), tb), bands: [D.meta.productive.twa_deg], x: tb, xmax, height: 110, ymin: 0, ymax: 180});
  // plan optimism: planned - realised over the plan horizon at each replan
  const optS = names.map(n => {
    const r = s.runs[n], xs = [], ys = [];
    for (const q of r.plans) {
      if (q.planned_value_kwh === null) continue;
      const i0 = q.t_s / dtS(), H = q.plan.x_km.length * q.plan.dt_s / dtS(), i1 = Math.min(i0 + H, s.n - 1);
      if (i1 <= i0) continue;
      xs.push(q.t_s / DAY); ys.push((q.planned_value_kwh - (interp(r.E, i1) - interp(r.E, i0))) / 1e3);
    }
    return {name: n, color: D.color[n], x: xs, y: ys};
  }).filter(q => q.x.length > 1 && q.name !== S.ref);
  if (optS.length) tsChart($("#ts-opt"), {title: "Plan optimism: planned - realised energy over the plan horizon", ylabel: "MWh", series: optS, dots: true, zero: true, xmax, height: 110, x: days});
  else $("#ts-opt").remove();
  // mode strip
  const W = chartW(el), rh = Math.round(11 * K), H = names.length * (rh + 3) + Math.round(40 * K), pw = W - ML - MR, X = d => ML + d / xmax * pw;
  let g = "";
  names.forEach((n, i) => {
    const y = 4 + i * (rh + 3), r = s.runs[n];
    g += `<rect x="${ML}" y="${y}" width="${pw}" height="${rh}" fill="var(--grid)"/><text x="${ML - 4}" y="${y + rh - 2}" text-anchor="end">${esc(n)}</text>`;
    let a = -1;
    for (let k = 0; k <= r.H.length; k++) {
      const h = k < r.H.length && r.H[k] > 0.5;
      if (h && a < 0) a = k; if (!h && a >= 0) { g += `<rect x="${X(a * dtS() / DAY)}" y="${y}" width="${Math.max(1, X(k * dtS() / DAY) - X(a * dtS() / DAY))}" height="${rh}" fill="${D.color[n]}"/>`; a = -1; }
    }
  });
  for (const t of niceTicks(0, xmax, 10)) g += `<text x="${X(t)}" y="${H - 7 * K}" text-anchor="middle">${t}</text>`;
  g += `<text x="${W - MR}" y="${H - 18 * K}" text-anchor="end" style="font-weight:600">days</text><text x="${ML + 4}" y="${H - 18 * K}" style="fill:var(--ink)">Mode: coloured = hold (station-keeping), grey = transit</text><line class="cur" y1="0" y2="${H - 24}" x1="0" x2="0"/>`;
  $("#ts-mode").innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" data-ml="${ML}" data-pw="${pw}" data-xmax="${xmax}" style="touch-action:none;cursor:crosshair">${g}</svg>`;
  // the last chart carries the x axis labels
  const last = el.querySelector("#ts-opt svg") || el.querySelector("#ts-twa svg");
  void last;
  el.querySelectorAll("svg").forEach(sv => {
    const f = e => { const r = sv.getBoundingClientRect(), W2 = +sv.viewBox.baseVal.width, x = (e.clientX - r.left) / r.width * W2, ml = +sv.dataset.ml, pw2 = +sv.dataset.pw, xm = +sv.dataset.xmax; setTf(clamp((x - ml) / pw2, 0, 1) * xm * DAY / dtS()); };
    sv.onpointerdown = e => { S.play = false; sv.setPointerCapture(e.pointerId); f(e); sv.onpointermove = f; };
    sv.onpointerup = () => { sv.onpointermove = null; };
  });
}
function moveCursor() {

    const l = sv.querySelector(".cur"); if (!l) return;
    const x = +sv.dataset.ml + S.tf * dtS() / DAY / +sv.dataset.xmax * +sv.dataset.pw;

  return /_REF$|^REF/.test(n) ? "r-REF" : /^B0_spec/.test(n) ? "r-B0_spec" : /^B0/.test(n) ? "r-B0" : /^B1/.test(n) ? "r-B1" : /^Oracle/i.test(n) ? "r-Oracle" : /^ENS/.test(n) ? "r-ENS" : /^REF/.test(n) ? "r-REF" : "r-generic";
}
let popTimer = null;
function showPop(t) {

  pop.innerHTML = `<b>${esc(k.replace(/^[mc]_/, ""))}</b><br>${esc(L(d))}${d.more ? `<br><a data-guide="${d.more}">${esc(ui("more"))} &rarr;</a>` : ""}`;

const hidePop = () => { $("#pop").style.display = "none"; };
function initPop() {

  document.addEventListener("mouseout", e => { if (e.target.closest("[data-d]") || e.target.closest("#pop")) { clearTimeout(popTimer); popTimer = setTimeout(hidePop, 250); } });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-guide]");

}
/* small markdown subset: ## / ### {#id}, tables, lists, paragraphs */
const TF = () => (G && G.tech_figures) || (D && D.tech_figures) || null;
function tfImg(f) { return f.svg ? f.svg : f.png_b64 ? `<img alt="" src="data:image/png;base64,${f.png_b64}">` : ""; }
function tfTxt(f, k) { return f[k + "_" + S.lang] || f[k + "_en"] || f[k + "_fr"] || ""; }
function tfBlock(f, i, big) {

}
function tfOpen(i) {
  const f = TF()[i], lb = $("#lightbox"); lb.querySelector(".lb").innerHTML = tfBlock(f, i, true).replace('class="tfig"', 'class="tfig" style="border:none;margin:0"'); lb.style.display = "flex";
}
function tfBind(root) { root.querySelectorAll(".tfimg").forEach(e => { e.onclick = ev => { ev.stopPropagation(); tfOpen(+e.closest("[data-tf]").dataset.tf); }; }); }
function figHtml(k) {
  const f = G.figures && G.figures[k]; if (!f) return "";
  return `<figure class="fig">${f.svg}<figcaption>${rich(f[S.lang] || f.en)}</figcaption></figure>`;
}
function mdHtml(src) {
  const out = []; let list = null, tab = null, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${rich(para.join(" "))}</p>`); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const endTab = () => { if (tab) { out.push('<div style="overflow-x:auto"><table>' + tab.map((r, i) => i === 0 ? `<tr>${r.map(c => `<th>${rich(c)}</th>`).join("")}</tr>` : `<tr>${r.map(c => `<td>${rich(c)}</td>`).join("")}</tr>`).join("") + "</table></div>"); tab = null; } };
  for (const raw of src.split("\n")) {
    const ln = raw.trimEnd(); let m;
    if (ln.startsWith("|")) { flush(); endList(); const cells = ln.replace(/^\||\|$/g, "").split("|").map(c => c.trim()); if (!cells.every(c => /^-+$/.test(c))) (tab = tab || []).push(cells); continue; }
    endTab();
    if ((m = ln.match(/^(##|###) (.+?)(?: \{#([\w-]+)\})?$/))) { flush(); endList(); const lv = m[1].length; out.push(`<h${lv} id="g-${m[3] || ""}">${rich(m[2])}</h${lv}>`); continue; }
    if ((m = ln.match(/^(- |\d+\. )(.*)$/))) { flush(); const tag = m[1] === "- " ? "ul" : "ol"; if (list !== tag) { endList(); out.push(`<${tag}>`); list = tag; } out.push(`<li>${rich(m[2])}</li>`); continue; }

}
function renderGuide() {

const closeGuide = () => { $("#guide").classList.remove("open"); S.gopen = false; };
/* attention chips computed from the data */
function computeChips() {
  const out = [], ns = D.seeds.length, J = (s, n) => s.runs[n] ? s.runs[n].metrics.energy_kwh : NaN;
  const meanOf = n => { const v = fin(D.seeds.map(s => s.runs[n] ? s.runs[n].diag.hold_share : NaN)); return v.length ? mean(v) : NaN; };
  // concentration of losses in the 3 worst days
  let best = null;
  for (const n of D.pnames.filter(q => q !== D.meta.reference)) D.seeds.forEach((s, si) => {
    const dl = dailyLossRef(s, n); if (!dl) return;
    const tot = dl.reduce((a, b) => a + Math.max(b, 0), 0), net = dl.reduce((a, b) => a + b, 0);
    if (net <= 0) return;
    const top = [...dl].sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + Math.max(b, 0), 0), share = top / net;
    if (share > 0.35 && (!best || net > best.net) && tot > 0) best = {n, si, share, net};
  });
  if (best) out.push({k: "concentr", v: {a: best.n, p: (100 * best.share).toFixed(0), s: D.seeds[best.si].seed}, act: () => { S.si = best.si; S.focus = best.n; setTab("ex"); }});
  const b1 = D.pnames.filter(n => /^B1_\d+d$/.test(n)).sort((a, b) => parseInt(a.slice(3)) - parseInt(b.slice(3)));
  if (b1.length >= 2) {
    const a = b1[b1.length - 1], b = b1[0]; let k = 0, n = 0;
    for (const s of D.seeds) if (s.runs[a] && s.runs[b]) { n++; if (J(s, a) < J(s, b)) k++; }
    if (n && k > n / 2) out.push({k: "b1long", v: {a, b, k, n}});
  }
  const hh = D.pnames.find(n => n !== D.meta.reference && meanOf(n) > 0.8);
  if (hh) out.push({k: "holdheavy", v: {a: hh, p: (100 * meanOf(hh)).toFixed(0)}});
  const pr = D.meta.params || {};
  if (ERA()) out.push({k: "era5", v: {}});
  else if (/synth/i.test(String(pr.weather || "")) || /synth/i.test(String((pr.polar && pr.polar.kind) || pr.polar || ""))) out.push({k: "synth", v: {}});
  if (ns < 5) out.push({k: "fewseeds", v: {n: ns}});
  if (/oracle/i.test(D.meta.reference)) out.push({k: "optim", v: {}});
  if (D.seeds.some(s => Object.values(s.runs).some(r => r.replans.some(q => q.diag && q.diag.weights)))) out.push({k: "ensdiag", v: {}});

}
function dailyLossRef(s, n) { const r = refRun(s); return r && s.runs[n] ? dailyLoss(s, n) : null; }
