<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--__TITLE__--></title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#e1e5ec;--grid:#e9ecf2;--accent:#2f5fd0;
--land:#b9b4a8;--buf:#8d887c;--band:rgba(245,170,20,.16);--sea:#eaf0f7;--hl:#fff7d6;--bad:#c4332b;--good:#1d7a4c}
body.dark{--bg:#12151c;--card:#1b2029;--ink:#e6e9f0;--mute:#98a2b3;--line:#2b3240;--grid:#262c38;--accent:#7aa2ff;
--land:#4a4a46;--buf:#3a3a36;--band:rgba(245,170,20,.14);--sea:#1b2433;--hl:#3a3320;--bad:#ff7b72;--good:#58d68d}
*{box-sizing:border-box}
html{font-size:13px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:0.615rem 1.385rem;align-items:center;padding:0.769rem 1.231rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
h1{font-size:1.231rem;margin:0}
.meta{color:var(--mute);font-size:0.923rem}
.tabs{display:flex;gap:0.308rem;margin-left:auto}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:0.462rem;padding:0.308rem 0.769rem;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:0.462rem 1.077rem;align-items:center;padding:0.615rem 1.231rem;border-bottom:1px solid var(--line);background:var(--card)}
.chip{display:inline-flex;align-items:center;gap:0.385rem;padding:0.154rem 0.692rem 0.154rem 0.462rem;border:1px solid var(--line);border-radius:7.615rem;cursor:pointer;user-select:none}
.chip.off{opacity:.4}
.dot{width:0.769rem;height:0.769rem;border-radius:50%;display:inline-block}
main{padding:0.923rem 1.231rem;margin:0 auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0.923rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(29.231rem,1fr));gap:0.923rem}
@media(max-width:80.769rem){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:0.769rem;padding:0.769rem 0.923rem;margin-bottom:0.923rem;min-width:0}
.card h2{font-size:1rem;margin:0 0 0.462rem;display:flex;gap:0.769rem;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mute)}
table{border-collapse:collapse;width:100%}
th,td{padding:0.231rem 0.615rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:0.923rem}
td.best{font-weight:700;color:var(--good)}
td.worst{color:var(--bad)}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--hl)}
.tw{overflow-x:auto}
canvas{display:block;border-radius:0.462rem;border:1px solid var(--line)}
svg{display:block;width:100%;overflow:visible}
svg text{fill:var(--mute);font-size:0.808rem}
svg .ax{stroke:var(--line)}svg .gl{stroke:var(--grid)}
svg .cur{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 2;pointer-events:none}
.row{display:flex;gap:0.769rem;align-items:center;flex-wrap:wrap;margin:0.308rem 0}
input[type=range]{flex:1;min-width:12.308rem}
.ro{font-variant-numeric:tabular-nums}
.hint{color:var(--mute);font-size:0.885rem;margin:0.154rem 0 0.462rem}
.legend{display:flex;gap:0.769rem;flex-wrap:wrap;font-size:0.885rem;color:var(--mute)}
label.ck{display:inline-flex;gap:0.308rem;align-items:center;cursor:pointer}
.mini{display:inline-block;vertical-align:middle}
.kv{table-layout:auto}.kv td:last-child{text-align:left;white-space:normal;word-break:break-word}.kv td{padding:1px 0.462rem}
.err{padding:2.308rem;color:var(--bad);font-size:1.154rem}
.cap{color:var(--mute);font-size:0.885rem;margin:-2px 0 0.462rem;line-height:1.35}
.ii{display:inline-block;width:1rem;height:1rem;border:1px solid var(--mute);border-radius:50%;font:italic 600 0.692rem/0.846rem Georgia,serif;text-align:center;color:var(--mute);cursor:help;margin-left:0.308rem;vertical-align:middle;font-weight:600}
.ii:hover{color:var(--accent);border-color:var(--accent)}
.term{border-bottom:1px dotted var(--mute);cursor:help}
#pop{position:fixed;z-index:60;max-width:24.615rem;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 0.308rem 1.385rem rgba(0,0,0,.25);border-radius:0.615rem;padding:0.615rem 0.769rem;font-size:0.923rem;display:none}
#pop a,.gbody a{color:var(--accent);cursor:pointer;text-decoration:underline}
#chips{display:flex;flex-wrap:nowrap;gap:0.462rem;padding:0.462rem 1.231rem 0;align-items:center;overflow:hidden}
#chips:empty{display:none}
.chip2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;font-size:0.885rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:0.231rem solid #d6a21e;border-radius:0.462rem;padding:0.154rem 0.615rem;cursor:pointer}
.chip2:hover{border-color:var(--accent)}
#guide{position:fixed;top:0;right:0;bottom:0;width:min(38.462rem,94vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 1.846rem rgba(0,0,0,.18);z-index:40;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
#guide.open{transform:none}
.ghead{display:flex;gap:0.615rem;align-items:center;padding:0.769rem 1.077rem;border-bottom:1px solid var(--line)}
.gnav{display:flex;flex-wrap:wrap;gap:0.308rem 0.769rem;padding:0.462rem 1.077rem;border-bottom:1px solid var(--line);font-size:0.885rem}
.gnav a{color:var(--accent);cursor:pointer}
.gbody{overflow:auto;padding:0.308rem 1.231rem 3.077rem;font-size:1rem;line-height:1.5}
.gbody h2{font-size:1.154rem;margin:1.538rem 0 0.462rem;padding-top:0.462rem;border-top:1px solid var(--line)}
.gbody h3{font-size:1rem;margin:1.077rem 0 0.308rem}
.gbody p{margin:0.308rem 0}.gbody ul,.gbody ol{margin:0.308rem 0;padding-left:1.538rem}
.gbody table{font-size:0.885rem;margin:0.462rem 0}.gbody th,.gbody td{text-align:left;white-space:normal}
.gbody .flash{background:var(--hl)}
.badge{font-size:0.808rem;font-weight:400;color:var(--good);border:1px solid var(--line);border-radius:7.615rem;padding:0 0.462rem;margin-left:0.462rem}
.badge.no{color:var(--mute)}
.fig{margin:.8rem 0;padding:.5rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg)}.fig svg{width:100%;height:auto;max-height:14rem;display:block}.fig figcaption{font-size:.92rem;margin-top:.3rem}
#primer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}#primer .pbox{background:var(--card);border-radius:.8rem;padding:1.2rem;width:min(40rem,94vw);box-shadow:0 .5rem 2rem rgba(0,0,0,.4)}#primer .fig{border:none;background:none}#primer svg{max-height:17rem}
#tour{position:fixed;right:1.231rem;bottom:1.231rem;z-index:70;width:24.615rem;background:var(--card);border:1px solid var(--accent);border-radius:0.769rem;padding:0.923rem;box-shadow:0 0.462rem 1.846rem rgba(0,0,0,.3);display:none}
#tour .row{justify-content:flex-end;margin-bottom:0}
.tour-hl{outline:0.154rem solid var(--accent);outline-offset:0.154rem;border-radius:0.462rem}
.q{font-size:0.769rem;color:var(--mute);border:1px solid var(--line);border-radius:50%;width:1rem;height:1rem;display:inline-block;text-align:center;line-height:0.846rem;margin-left:0.231rem}
#exgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:.9rem;align-items:start}
#exgrid .c3{grid-column:1/-1}
#ovgrid{display:grid;grid-template-columns:1fr;gap:0 .9rem}
@media(min-width:1100px){#ovgrid{grid-template-columns:1fr 1fr}#ovgrid .ov-wide{grid-column:1/-1}}
body.wide{--wide:1}
body.wide #exgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
body.wide #exgrid .c3{grid-column:auto;max-height:calc(100vh - 11rem);overflow:auto}
body.wide #exgrid .c3 .grid3{grid-template-columns:1fr 1fr}
body.wide #ovgrid .ov-wide{grid-column:auto}
body.wide #ovgrid{grid-template-columns:1.35fr 1fr}
body.wide .card{margin-bottom:.9rem}
.zoom button{padding:.1rem .45rem}
#map{margin:0 auto}
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1><span class="meta" id="meta"></span>
  <span class="tabs"><button id="tab-ov" class="on" data-ui="tab-ov">Overview</button><button id="tab-ex" data-ui="tab-ex">Explorer</button><button id="tab-seasons" data-ui="tab-seasons" style="display:none">Seasons</button><button id="tab-polar" data-ui="tab-polar" style="display:none">Polar</button>
  <span class="zoom"><button id="zm" title="Smaller UI">A&minus;</button><button id="z0" title="Reset UI size">A</button><button id="zp" title="Larger UI">A+</button></span><button id="guide-btn" data-ui="guide">Guide</button><button id="primerbtn" data-ui="primer">Primer</button><button id="tourbtn" data-ui="tour" title="Tour">Tour</button><button id="lang">EN</button>
  <button id="theme" title="Toggle dark mode">Dark</button></span>
</header>
<div class="bar" id="bar"></div>
<div id="chips"></div>
<main id="app"><div class="err" id="loading" style="color:var(--mute)">Decoding data...</div></main>
<!--__DATA__-->
<aside id="guide"><div class="ghead"><b style="flex:1" data-ui="guide">Guide</b><button id="gclose" data-ui="close">Close</button></div><div class="gnav" id="gnav"></div><div class="gbody" id="gbody"></div></aside>
<div id="pop"></div>
<div id="tour"></div><div id="primer"><div class="pbox"></div></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const fmt = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? "-" : v.toFixed(d);
const KN = 1852 / 3600, DAY = 86400;
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const std = a => a.length < 2 ? 0 : Math.sqrt(a.reduce((s, v) => s + (v - mean(a)) ** 2, 0) / (a.length - 1));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const PAL = ["#7b4ea3", "#8c564b", "#1b9aaa", "#b08900", "#c2185b", "#455a64"];
const FIXED = {Oracle: "#d62728", B0: "#7f7f7f", B0_spec: "#e377c2", B1_5d: "#1f77b4", B1_15d: "#17806d"};
let D, S, G;   // data, state, content (guide + glossary)
const L = o => (o && (o[S.lang] || o.en)) || "";
const ui = k => L(G.ui[k]);
const termKey = k => G.defs[k] ? k : (G.defs[k.toLowerCase()] ? k.toLowerCase() : null);
/* inline rich text: **bold**, [[term]] or [[term|label]] -> glossary term, [label](#section) -> guide link */
function rich(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, lab) => {
    const key = termKey(k); return key ? `<span class="term" data-d="${esc(key)}">${lab || k}</span>` : (lab || k);
  }).replace(/\[([^\]]+)\]\(#([\w-]+)\)/g, '<a data-guide="$2">$1</a>');
}
const cap = id => G.captions[id] ? `<div class="cap">${rich(L(G.captions[id]))}</div>` : "";
const ERA = () => D.meta.weather_kind === "era5";
const UW = () => ERA() ? "Mission" : "Seed";
const mlabel = q => ERA() ? `${q.label || q.seed} (${(q.epoch || D.meta.epoch).slice(0, 10)})` : String(q.seed);
const mshort = q => ERA() ? (q.epoch || D.meta.epoch).slice(5, 10) : String(q.seed);
const info = k => G.defs[k] ? `<i class="ii" data-d="${esc(k)}">i</i>` : "";

// ------------------------------------------------------------------ data loading
function b64bytes(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function loadData() {
  const el = document.getElementById("hz-data");
  if (el.dataset.enc === "json") return JSON.parse(el.textContent);
  if (typeof DecompressionStream === "undefined") throw new Error("This browser lacks DecompressionStream; use a current Chrome, Edge, Firefox or Safari.");
  const ds = new Blob([b64bytes(el.textContent.trim())]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
const nz = a => Float64Array.from(a, v => v === null ? NaN : v);
function prepare(d) {
  const mp = d.map;
  mp.SDF = new Int16Array(b64bytes(mp.sdf.b64).buffer);
  const g = mp.grid;
  mp.xmin = g.x0_km - g.dx_km / 2; mp.xmax = g.x0_km + (g.nx - 0.5) * g.dx_km;
  mp.ymin = g.y0_km - g.dx_km / 2; mp.ymax = g.y0_km + (g.ny - 0.5) * g.dx_km;
  if (mp.era5_mask) mp.M = new Uint8Array(b64bytes(mp.era5_mask.b64).buffer);
  if (d.polar) { const pl = d.polar; pl.P = new Int16Array(b64bytes(pl.p.b64).buffer); pl.nT = pl.tws_kn.length; pl.nA = pl.twa_deg.length; pl.nU = pl.u_ms.length; pl.umax = pl.u_ms[pl.nU - 1]; }
  d.pnames = d.policies.map(p => p.name);
  d.color = {}; let k = 0;
  d.pnames.forEach(n => { d.color[n] = FIXED[n] || PAL[k++ % PAL.length]; });
  d.label = {}; d.policies.forEach(p => { d.label[p.name] = p.label || p.name; });
  for (const s of d.seeds) {
    const w = s.wind;
    w.U = new Int8Array(b64bytes(w.u.b64).buffer); w.V = new Int8Array(b64bytes(w.v.b64).buffer);
    w.TH = new Float32Array(b64bytes(w.theta.b64).buffer);
    s.T = nz(s.t_s); s.n = s.T.length;
    for (const [name, r] of Object.entries(s.runs)) {
      r.name = name;
      r.X = nz(r.x_km); r.Y = nz(r.y_km); r.E = nz(r.energy_kwh);
      r.SP = r.speed_ms ? nz(r.speed_ms) : Float64Array.from(r.X.slice(0, -1), (x, k) => Math.hypot(r.X[k + 1] - x, r.Y[k + 1] - r.Y[k]) * 1000 / d.meta.export_dt_s);
      r.P = nz(r.power_kw); r.H = nz(r.hold_frac); r.TWS = nz(r.tws_ms); r.TWA = nz(r.twa_deg);
      r.plans = r.replans.filter(q => q.plan);
    }
  }
}

// ------------------------------------------------------------------ derived quantities
const dtS = () => D.meta.export_dt_s;
const seed = () => D.seeds[S.si];
const run = (s, n) => s.runs[n];
function refRun(s) { return s.runs[S.ref] || null; }
function jRef(s) { const r = refRun(s); return r ? r.metrics.energy_kwh : NaN; }
const METRICS = {
  CF: {label: "Capacity factor CF", d: 3, hi: true, f: r => r.metrics.capacity_factor},
  J: {label: "Energy J [MWh]", d: 1, hi: true, f: (r, s) => r.metrics.energy_kwh / 1e3},
  REG: {label: "Regret vs reference [%]", d: 1, hi: false, f: (r, s) => 100 * (jRef(s) - r.metrics.energy_kwh) / jRef(s)},
  HOLD: {label: "Time in hold [%]", d: 0, hi: null, f: r => 100 * r.diag.hold_share},
  PROD: {label: "Productive band [% time]", d: 1, hi: true, f: r => 100 * r.diag.productive_share},
  TWSB: {label: "TWS 18-26 kn [% time]", d: 1, hi: true, f: r => 100 * r.diag.tws_band_share},
  SPD: {label: "Mean speed [kn]", d: 2, hi: null, f: r => r.diag.mean_speed_ms / KN},
  DIST: {label: "Distance [km]", d: 0, hi: null, f: r => r.metrics.distance_km},
  TWS: {label: "Mean experienced TWS [kn]", d: 1, hi: true, f: r => r.diag.mean_tws_ms / KN}
};
function metricVals(name, key) { // per seed values (NaN if missing)
  return D.seeds.map(s => s.runs[name] ? METRICS[key].f(s.runs[name], s) : NaN);
}
const fin = a => a.filter(isFinite);
function interp(arr, tf) { // arr indexed by export step; fractional index
  const i = clamp(Math.floor(tf), 0, arr.length - 2), a = clamp(tf - i, 0, 1);
  return arr[i] * (1 - a) + arr[i + 1] * a;
}
function movavg(a, w) {
  if (w <= 1) return a;
  const out = new Float64Array(a.length), h = Math.floor(w / 2);
  for (let i = 0; i < a.length; i++) {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - h); j <= Math.min(a.length - 1, i + h); j++) if (isFinite(a[j])) { s += a[j]; c++; }
    out[i] = c ? s / c : NaN;
  }
  return out;
}
function gap(s, n) { // accumulated energy lost vs reference [kWh] at each sample
  const r = run(s, n), ref = refRun(s);
  if (!r || !ref) return null;
  return ref.E.map((v, i) => v - r.E[i]);
}
function dailyLoss(s, n) {
  const g = gap(s, n); if (!g) return null;
  const per = Math.round(DAY / dtS()), out = [];
  for (let d = 0; d * per < g.length - 1; d++) out.push(g[Math.min((d + 1) * per, g.length - 1)] - g[d * per]);
  return out;
}
function topLosses(s, n, wH, k = 5) {
  const g = gap(s, n); if (!g) return [];
  const w = Math.max(1, Math.round(wH * 3600 / dtS())), L = [];
  for (let i = 0; i + w < g.length; i++) L.push([g[i + w] - g[i], i]);
  L.sort((a, b) => b[0] - a[0]);
  const picked = [];
  for (const [v, i] of L) {
    if (v <= 0 || picked.length >= k) break;
    if (picked.every(p => Math.abs(p.i - i) >= w)) picked.push({loss: v, i, w});
  }
  const r = run(s, n), ref = refRun(s);
  for (const p of picked) {
    const sl = a => { let m = 0, c = 0; for (let j = p.i; j < p.i + p.w; j++) if (isFinite(a[j])) { m += a[j]; c++; } return c ? m / c : NaN; };
    p.hold = sl(r.H); p.tws = sl(r.TWS) / KN; p.pw = sl(r.P); p.pref = sl(ref.P); p.twsref = sl(ref.TWS) / KN;
  }
  return picked;
}
const dayStr = i => (i * dtS() / DAY).toFixed(2);
function clock(tf) {
  const t0 = Date.parse(seed().epoch || D.meta.epoch), d = new Date(t0 + tf * dtS() * 1000);
  return d.toISOString().slice(0, 16).replace("T", " ") + " UTC";
}

// ------------------------------------------------------------------ SVG chart helpers
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  const st = (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  const out = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(10));
  return out;
}
function pathOf(xs, ys, X, Y) {
  let d = "", pen = false;
  for (let i = 0; i < xs.length; i++) {
    if (!isFinite(ys[i])) { pen = false; continue; }
    d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(ys[i]).toFixed(1); pen = true;
  }
  return d;
}
let K = 1, ML = 54, MR = 10;
/* UI scale: root font size follows the viewport width (13 px laptop .. 18 px 4K) times the user zoom. */
function setScale() {
  const px = clamp(0.4 * window.innerWidth / 100 * 1 + 7.5, 13, 18) * (S ? S.zoom : 1);
  document.documentElement.style.fontSize = px.toFixed(2) + "px";
  K = px / 13; ML = Math.round(54 * K); MR = Math.round(10 * K);
  const wide = window.innerWidth >= 2400; document.body.classList.toggle("wide", wide); S && (S.wide = wide);
}
function chartW(el) { return Math.max(300, el.clientWidth || 600); }
/* Time-series chart. opts: series[{name,color,y,w,dash}], bands[[y0,y1]], zero, height, title, ylabel, x (days), xmax, ticksX, shade[[x0,x1]] */
function tsChart(el, o) {
  const W = chartW(el), H = Math.round((o.height || 120) * (!o.fixed && S.wide && S.tsU ? S.tsU / 110 : K)), T = Math.round(8 * K), B = Math.round((o.xaxis ? 30 : 4) * K), pw = W - ML - MR, ph = H - T - B;
  let lo = Infinity, hi = -Infinity;
  for (const s of o.series) for (const v of s.y) if (isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (o.ymin !== undefined) lo = o.ymin; if (o.ymax !== undefined) hi = o.ymax;
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.05 || 1; if (o.ymin === undefined) lo -= pad; if (o.ymax === undefined) hi += pad;
  const X = x => ML + x / o.xmax * pw, Y = y => T + (1 - (y - lo) / (hi - lo)) * ph;
  let g = "";
  for (const t of niceTicks(lo, hi, Math.max(2, Math.floor(ph / 28)))) g += `<line class="gl" x1="${ML}" x2="${W - MR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ML - 4}" y="${Y(t) + 3}" text-anchor="end">${+t.toFixed(3)}</text>`;
  for (const t of niceTicks(0, o.xmax, 10)) {
    g += `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${T + ph}"/>`;
    if (o.xaxis) g += `<text x="${X(t)}" y="${H - 15 * K}" text-anchor="middle">${t}</text>`;
  }
  if (o.xaxis) g += `<text x="${W - MR}" y="${H - 3 * K}" text-anchor="end" style="font-weight:600">${o.xlabel || "days"}</text>`;
  for (const b of o.bands || []) g += `<rect x="${ML}" width="${pw}" y="${Y(b[1])}" height="${Math.abs(Y(b[0]) - Y(b[1]))}" fill="var(--band)"/>`;
  for (const sh of o.shade || []) g += `<rect x="${X(sh[0])}" width="${Math.max(2, X(sh[1]) - X(sh[0]))}" y="${T}" height="${ph}" fill="${sh[2] || "#f5aa14"}" opacity=".22"/>`;
  if (o.zero) g += `<line class="ax" x1="${ML}" x2="${W - MR}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  for (const s of o.series) {
    const xs = s.x || o.x;
    if (o.dots) g += xs.map((x, i) => isFinite(s.y[i]) ? `<circle cx="${X(x).toFixed(1)}" cy="${Y(s.y[i]).toFixed(1)}" r="2.3" fill="${s.color}"/>` : "").join("");
    else g += `<path d="${pathOf(xs, s.y, X, Y)}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.5}" ${s.dash ? 'stroke-dasharray="4 3"' : ""} stroke-linejoin="round"/>`;

  if (o.ylabel) g += `<text x="${W - MR - 2}" y="${T + 10}" text-anchor="end">${o.ylabel}</text>`;
  g += `<line class="cur" y1="${T}" y2="${T + ph}" x1="0" x2="0"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" style="touch-action:none;cursor:crosshair" data-ml="${ML}" data-pw="${pw}" data-xmax="${o.xmax}">${g}</svg>`;

/* Generic bar/line chart with categories; returns svg string. */
function barsSvg(W, H, cats, series, o = {}) { // series: [{name,color,v:[per cat]}]
  const L = 44 * K, R = 8 * K, T = 10 * K, B = (o.labelH || 22) * K, pw = W - L - R, ph = H - T - B;
  let lo = 0, hi = -Infinity, mn = 0;
  for (const s of series) for (const v of s.v) if (isFinite(v)) { hi = Math.max(hi, v); mn = Math.min(mn, v); }
  lo = mn; if (!isFinite(hi)) hi = 1; if (hi === lo) hi = lo + 1;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * ph;
  let g = "";
  for (const t of niceTicks(lo, hi, 4)) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 4}" y="${Y(t) + 3}" text-anchor="end">${+t.toFixed(3)}</text>`;
  const gw = pw / cats.length, bw = Math.min(26, gw * 0.8 / series.length);
  cats.forEach((c, ci) => {
    const x0 = L + ci * gw + gw / 2 - bw * series.length / 2;
    series.forEach((s, si) => {
      const v = s.v[ci]; if (!isFinite(v)) return;
      const y1 = Y(Math.max(v, 0)), y2 = Y(Math.min(v, 0));
      g += `<rect x="${x0 + si * bw}" y="${y1}" width="${bw - 1}" height="${Math.max(0.5, y2 - y1)}" fill="${s.colors ? s.colors[ci] : s.color}" ${s.opacity ? 'fill-opacity="' + s.opacity + '"' : ""}><title>${esc(s.name)} ${esc(c)}: ${v.toFixed(2)}</title></rect>`;
      if (s.err && isFinite(s.err[ci])) g += `<line x1="${x0 + si * bw + bw / 2}" x2="${x0 + si * bw + bw / 2}" y1="${Y(v - s.err[ci])}" y2="${Y(v + s.err[ci])}" stroke="var(--ink)"/>`;
      if (s.pts) for (const p of s.pts[ci]) if (isFinite(p)) g += `<circle cx="${x0 + si * bw + bw / 2}" cy="${Y(p)}" r="2.4" fill="var(--card)" stroke="var(--ink)"/>`;
    });
    if (!o.noLabels || ci % o.noLabels === 0) g += `<text x="${L + ci * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${esc(c)}</text>`;
  });
  g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
}
/* histogram lines: edges (centres), series values */
function histSvg(W, H, centres, series, band, xlab, pct = true) {
  const L = 40 * K, R = 8 * K, T = 8 * K, B = 32 * K, pw = W - L - R, ph = H - T - B;
  let hi = 0; for (const s of series) for (const v of s.v) hi = Math.max(hi, v);
  hi = hi * 1.08 || 1;
  const x0 = centres[0], x1 = centres[centres.length - 1], bw = (centres[1] - centres[0]);
  const X = x => L + (x - (x0 - bw / 2)) / (x1 - x0 + bw) * pw, Y = v => T + (1 - v / hi) * ph;
  let g = `<rect x="${X(band[0])}" width="${X(band[1]) - X(band[0])}" y="${T}" height="${ph}" fill="var(--band)"/>`;
  for (const t of niceTicks(0, hi * 100, 4)) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t / 100)}" y2="${Y(t / 100)}"/><text x="${L - 4}" y="${Y(t / 100) + 3}" text-anchor="end">${pct ? t + "%" : +(t / 100).toFixed(2)}</text>`;
  for (const t of niceTicks(x0 - bw / 2, x1 + bw / 2, 8)) g += `<text x="${X(t)}" y="${H - 18}" text-anchor="middle">${t}</text>`;
  g += `<text x="${W - R}" y="${H - 4}" text-anchor="end" style="font-weight:600">${xlab}</text>`;
  for (const s of series) {
    let d = "";
    centres.forEach((c, i) => { d += (i ? "L" : "M") + X(c).toFixed(1) + " " + Y(s.v[i]).toFixed(1); });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
}

function buildTS() {

  const days = Array.from(s.T, t => t / DAY), xmax = days[days.length - 1], tb = Array.from({length: s.n - 1}, (_, i) => (i + 0.5) * dtS() / DAY);
  const sm = Math.max(1, Math.round(S.smooth * 3600 / dtS()));

function polarCbar(w) { // colour bar with real kW ticks

}
function renderPolar() {

function shipU(r, i) { return r.speed_ms ? r.speed_ms[i] : Math.hypot(r.X[i + 1] - r.X[i], r.Y[i + 1] - r.Y[i]) * 1000 / dtS(); }

// ------------------------------------------------------------------ pedagogy: popovers, chips, guide, tour
function routerKey(n) {

}
let popTimer = null;

  pop.innerHTML = `<b>${esc(k.replace(/^[mc]_/, ""))}</b><br>${esc(L(d))}${d.more ? `<br><a data-guide="${d.more}">${esc(ui("more"))} &rarr;</a>` : ""}`;
  pop.style.display = "block";

}
const hidePop = () => { $("#pop").style.display = "none"; };
function initPop() {

/* small markdown subset: ## / ### {#id}, tables, lists, paragraphs */
function figHtml(k) {
  const f = G.figures && G.figures[k]; if (!f) return "";
  return `<figure class="fig">${f.svg}<figcaption>${rich(f[S.lang] || f.en)}</figcaption></figure>`;
}
function mdHtml(src) {
  const out = []; let list = null, tab = null, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${rich(para.join(" "))}</p>`); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const endTab = () => { if (tab) { out.push('<div style="overflow-x:auto"><table>' + tab.map((r, i) => i === 0 ? `<tr>${r.map(c => `<th>${rich(c)}</th>`).join("")}</tr>` : `<tr>${r.map(c => `<td>${rich(c)}</td>`).join("")}</tr>`).join("") + "</table></div>"); tab = null; } };
  for (const raw of src.split("\n")) {
    const ln = raw.trimEnd(); let m;
    if (ln.startsWith("|")) { flush(); endList(); const cells = ln.replace(/^\||\|$/g, "").split("|").map(c => c.trim()); if (!cells.every(c => /^-+$/.test(c))) (tab = tab || []).push(cells); continue; }
    endTab();
    if ((m = ln.match(/^(##|###) (.+?)(?: \{#([\w-]+)\})?$/))) { flush(); endList(); const lv = m[1].length; out.push(`<h${lv} id="g-${m[3] || ""}">${rich(m[2])}</h${lv}>`); continue; }
    if ((m = ln.match(/^(- |\d+\. )(.*)$/))) { flush(); const tag = m[1] === "- " ? "ul" : "ol"; if (list !== tag) { endList(); out.push(`<${tag}>`); list = tag; } out.push(`<li>${rich(m[2])}</li>`); continue; }
    if ((m = ln.match(/^!fig (\w+)$/))) { flush(); endList(); out.push(figHtml(m[1])); continue; }
    if (!ln.trim()) { flush(); endList(); continue; }
    endList(); para.push(ln.trim());
  }
  flush(); endList(); endTab(); return out.join("\n");
}
function renderGuide() {
  const html = mdHtml(G.guide[S.lang]);
  $("#gbody").innerHTML = html;
  const used = new Set(D.pnames.map(routerKey));
  $("#gbody").querySelectorAll("h3[id^=g-r-]").forEach(h => { const id = h.id.slice(2), on = used.has(id); h.insertAdjacentHTML("beforeend", `<span class="badge ${on ? "" : "no"}">${esc(ui(on ? "in_export" : "not_in_export"))}</span>`); });
  const g = $("#g-r-generic"); if (g) { const gen = D.pnames.filter(n => routerKey(n) === "r-generic"); if (gen.length) g.insertAdjacentHTML("afterend", `<p><b>${esc(gen.join(", "))}</b></p>`); }
  $("#gnav").innerHTML = [...$("#gbody").querySelectorAll("h2")].map(h => `<a data-gn="${h.id}">${h.textContent}</a>`).join("");

function openGuide(id) {

  if (id) { const el = $("#g-" + id) || $("#g-" + id.replace(/^r-.*/, "routers")); if (el) { el.scrollIntoView({behavior: "smooth", block: "start"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); } }

const closeGuide = () => { $("#guide").classList.remove("open"); S.gopen = false; };
/* attention chips computed from the data */
function computeChips() {
  const out = [], ns = D.seeds.length, J = (s, n) => s.runs[n] ? s.runs[n].metrics.energy_kwh : NaN;
  const meanOf = n => { const v = fin(D.seeds.map(s => s.runs[n] ? s.runs[n].diag.hold_share : NaN)); return v.length ? mean(v) : NaN; };
  // concentration of losses in the 3 worst days
  let best = null;
  for (const n of D.pnames.filter(q => q !== D.meta.reference)) D.seeds.forEach((s, si) => {
    const dl = dailyLossRef(s, n); if (!dl) return;
    const tot = dl.reduce((a, b) => a + Math.max(b, 0), 0), net = dl.reduce((a, b) => a + b, 0);
    if (net <= 0) return;
    const top = [...dl].sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + Math.max(b, 0), 0), share = top / net;

  });

  const b1 = D.pnames.filter(n => /^B1_\d+d$/.test(n)).sort((a, b) => parseInt(a.slice(3)) - parseInt(b.slice(3)));

}

/* first-visit visual primer: the schematics one after the other */

  $("#zm").onclick = () => setZ(zs[Math.max(0, zs.indexOf(S.zoom) - 1)] || 1); $("#zp").onclick = () => setZ(zs[Math.min(zs.length - 1, zs.indexOf(S.zoom) + 1)] || 1); $("#z0").onclick = () => setZ(1);
